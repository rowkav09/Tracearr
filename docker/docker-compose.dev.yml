# LOCAL DEVELOPMENT ONLY - Database services for running Tracearr in dev mode
# NOT for production deployment - see docker/examples/ for deployment configs

services:
  timescale:
    build:
      context: .
      dockerfile: Dockerfile.timescale
    image: tracearr-timescale:latest
    shm_size: 512mb # Required for PostgreSQL shared memory (increase for large imports)
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=tracearr
      - POSTGRES_DB=tracearr
    volumes:
      - timescale_dev_data:/var/lib/postgresql/data
      - ./init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracearr']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

